/* ====================== Ações ====================== */
function autoCategoria(desc){
  const d = ' ' + String(desc).toLowerCase() + ' ';
  for (const [p, c] of S.autoCat){ if (p.split('|').some(t => t && d.includes(t.toLowerCase()))) return c; }
  return 'outros';
}
function addTx(t){ S.transacoes.push({id:uid(), aprovada:false, fonte:'manual', quem:'casa', pagou:S.moradores[0]?.id, ...t}); }

function ask(titulo, msg, o = {}){
  return new Promise(res => {
    const d = $('#dlg'); d.onclose = null; if (d.open) d.close();
    d.innerHTML = `<div class="hd">${titulo}</div><div class="bd"><div>${msg}</div>${o.input ? `<input id="ask_in" ${o.num ? 'inputmode="decimal"' : ''} value="${esc(o.valor ?? '')}" placeholder="${esc(o.ph || '')}">` : ''}</div><div class="ft"><button id="ask_no">Cancelar</button><button class="p" id="ask_ok" ${o.perigo ? 'style="background:var(--bad);border-color:var(--bad);color:#fff"' : ''}>${o.ok || 'Confirmar'}</button></div>`;
    let feito = false; const fim = v => { if (feito) return; feito = true; d.onclose = null; if (d.open) d.close(); res(v); };
    $('#ask_no').onclick = () => fim(o.input ? null : false);
    $('#ask_ok').onclick = () => fim(o.input ? $('#ask_in').value : true);
    if (o.input) $('#ask_in').onkeydown = e => { if (e.key === 'Enter') fim($('#ask_in').value); };
    d.onclose = () => { if (!d.open) fim(o.input ? null : false); }; // ignora o evento 'close' atrasado do diálogo anterior
    d.showModal(); setTimeout(() => (o.input ? $('#ask_in') : $('#ask_ok')).focus(), 30);
  });
}
function dialog(titulo, corpo, botoes){
  const d = $('#dlg'); d.onclose = null;
  d.innerHTML = `<div class="hd">${titulo}<span class="sp"></span><button class="x" onclick="$('#dlg').close()">✕</button></div><div class="bd">${corpo}</div><div class="ft">${botoes}</div>`;
  d.showModal();
}

const A = {
  mes(k){ MES = addM(MES, k); render(); },
  sugCat(desc, id){ const c = autoCategoria(desc); if (c !== 'outros') document.getElementById(id).value = c; },
  novoGasto(){ A.editar(null); },
  editar(id){
    const t = id ? S.transacoes.find(x => x.id === id) : {data: MES === HOJE_YM ? HOJE : `${MES}-01`, desc:'', valor:'', cat:'outros', quem:'casa', pagou:S.moradores[0]?.id};
    if (!t) return;
    dialog(id ? 'Editar gasto' : 'Lançar gasto', `
      <label>Descrição<input id="d_desc" value="${esc(t.desc)}" oninput="A.sugCat(this.value,'d_cat')" placeholder="ex.: Conta de luz"></label>
      <div class="form"><label>Valor (R$)<input id="d_val" inputmode="decimal" value="${t.valor !== '' ? N(t.valor, 2) : ''}"></label><label>Data<input type="date" id="d_data" value="${t.data}"></label></div>
      <label>Categoria<select id="d_cat">${catOpts(t.cat)}</select></label>
      <div class="form"><label>Quem consumiu<select id="d_quem">${quemOpts(t.quem)}</select></label><label>Quem pagou<select id="d_pagou">${quemOpts(t.pagou, false)}</select></label></div>
      ${id ? `<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="d_apr" style="width:auto" ${t.aprovada ? 'checked' : ''}> Compra aprovada pela casa</label>` : ''}`,
      `${id ? `<button style="color:var(--bad)" onclick="A.del('${id}')">Excluir</button><span class="sp"></span>` : ''}<button onclick="$('#dlg').close()">Cancelar</button><button class="p" onclick="A.salvarTx(${id ? `'${id}'` : 'null'})">Salvar</button>`);
    setTimeout(() => $('#d_' + (id ? 'val' : 'desc')).focus(), 50);
  },
  salvarTx(id){
    const v = numIn(val('d_val')), desc = val('d_desc') || 'Gasto';
    if (!(v > 0)) return toast('Informe um valor maior que zero');
    const dados = {desc, valor:v, data:val('d_data') || HOJE, cat:val('d_cat'), quem:val('d_quem'), pagou:val('d_pagou')};
    if (id){ const t = S.transacoes.find(x => x.id === id); Object.assign(t, dados, {aprovada: !!$('#d_apr')?.checked}); }
    else addTx(dados);
    S.onboarded = true; save(); $('#dlg').close(); MES = ymOf(dados.data); render(); toast('Gasto salvo');
  },
  addRapido(){
    const v = numIn(val('q_val'));
    if (!(v > 0)) return toast('Informe um valor');
    addTx({data:val('q_data') || HOJE, desc:val('q_desc') || 'Gasto', valor:v, cat:val('q_cat'), quem:val('q_quem'), pagou:val('q_pagou')});
    S.onboarded = true; save(); render(); toast('Adicionado'); setTimeout(() => $('#q_desc')?.focus(), 30);
  },
  async del(id){ if (!await ask('Excluir lançamento', 'Excluir este lançamento?', {ok:'Excluir', perigo:true})) return; S.transacoes = S.transacoes.filter(t => t.id !== id); save(); render(); },
  setCat(id, c){ const t = S.transacoes.find(x => x.id === id); t.cat = c; save(); toast('Categoria atualizada'); },
  filtrar(c){ FILTRO.cat = c; go('lancamentos'); render(); },
  aprovar(id){ const t = S.transacoes.find(x => x.id === id); t.aprovada = true; save(); render(); toast('Compra aprovada'); },
  lerArquivo(inp){ const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#csvTxt').value = r.result; toast('Arquivo carregado — confira e clique Importar'); }; r.readAsText(f, 'utf-8'); },
  importar(){
    const txt = $('#csvTxt').value.trim(); if (!txt) return toast('Cole ou escolha um CSV');
    const linhas = txt.split(/\r?\n/).filter(l => l.trim());
    const h = linhas[0], sep = (h.match(/;/g) || []).length >= (h.match(/,/g) || []).length ? ';' : (h.match(/\t/g) || []).length ? '\t' : ',';
    const split = l => { const out = []; let cur = '', q = false; for (const ch of l){ if (ch === '"') q = !q; else if (ch === sep && !q){ out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
    const parseData = s => { s = s.trim(); let m;
      if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
      if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; }
      return null; };
    const parseVal = s => { s = s.replace(/R\$|\s/g, ''); if (!s) return NaN; let neg = /^-|-$|^\(.*\)$/.test(s); s = s.replace(/[()\-]/g, '');
      if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
      else if (s.includes(',')) s = s.replace(',', '.');
      const v = parseFloat(s); return neg ? -v : v; };
    let cols = split(h).map(c => c.toLowerCase());
    let iD = cols.findIndex(c => /data|date/.test(c)), iT = cols.findIndex(c => /descri|hist|lan[çc]|estabelec|title|memo/.test(c)), iV = cols.findIndex(c => /valor|amount|quantia/.test(c));
    let rows = linhas;
    if (iD >= 0 && iV >= 0){ rows = linhas.slice(1); if (iT < 0) iT = [0, 1, 2, 3].find(i => i !== iD && i !== iV); }
    else { iD = 0; iT = 1; iV = 2; if (!parseData(split(h)[0] || '')) rows = linhas.slice(1); }
    const parsed = rows.map(split).map(r => ({data:parseData(r[iD] || ''), desc:(r[iT] || '').replace(/^"|"$/g, ''), v:parseVal(r[iV] || '')})).filter(r => r.data && isFinite(r.v) && r.v !== 0);
    const temNeg = parsed.some(r => r.v < 0);
    const quem = val('csvQuem'), pagou = val('csvPagou');
    let n = 0, dup = 0, ign = 0;
    for (const r of parsed){
      if (temNeg && r.v > 0){ ign++; continue; }
      const v = Math.abs(r.v);
      if (S.transacoes.some(t => t.data === r.data && Math.abs(t.valor - v) < 0.005 && t.desc === r.desc)){ dup++; continue; }
      addTx({data:r.data, desc:r.desc || 'Importado', valor:v, cat:autoCategoria(r.desc), quem, pagou, fonte:'csv'}); n++;
    }
    if (!n && !dup) return toast('Nenhuma linha reconhecida. Verifique as colunas data/descrição/valor.');
    S.onboarded = true; save();
    const ultimo = parsed.filter(r => !(temNeg && r.v > 0)).map(r => r.data).sort().pop();
    if (ultimo) MES = ymOf(ultimo);
    render(); toast(`${n} importado(s) · ${dup} duplicado(s) · ${ign} crédito(s) ignorado(s)`);
  },
  setOrc(c, v){ const x = numIn(v); if (x > 0) S.orcamentos[c] = x; else delete S.orcamentos[c]; save(); render(); },
  sugerirOrc(){
    const h = mediaCat(MES, 3); if (!Object.keys(h).length) return toast('Sem histórico suficiente');
    for (const k in h) if (k !== 'outros') S.orcamentos[k] = Math.ceil(h[k] * (cat(k).grupo === 'estilo' ? 0.9 : 1) / 10) * 10;
    save(); render(); toast('Orçamento sugerido (estilo de vida com 10% de corte)');
  },
  addPlan(){ const v = num('pl_val'); if (!val('pl_nome') || !(v > 0) || !val('pl_ini')) return toast('Preencha nome, valor e início');
    S.planejados.push({id:uid(), nome:val('pl_nome'), valor:v, cat:val('pl_cat'), inicio:val('pl_ini'), fim:val('pl_fim') || ''}); save(); render(); toast('Gasto planejado incluído na previsão'); },
  async delItem(col, id){ if (!await ask('Remover item', 'Remover este item?', {ok:'Remover', perigo:true})) return; S[col] = S[col].filter(x => x.id !== id); save(); render(); },
  simular(){
    const p = num('sv_p'), d = num('sv_d')/100, n = Math.max(1, Math.round(num('sv_n'))), j = num('sv_j')/100, r = num('sv_r')/100;
    const vista = p * (1 - d);
    const parc = j > 0 ? p * j / (1 - Math.pow(1 + j, -n)) : p / n;
    const totParc = parc * n;
    // valor presente das parcelas descontado pelo rendimento da reserva
    const vp = r > 0 ? parc * (1 - Math.pow(1 + r, -n)) / r : totParc;
    const melhor = vista <= vp ? 'à vista' : 'parcelado';
    const pv = previsao(MES), orc = sum(Object.values(S.orcamentos)), folga = orc ? orc - pv.total : null;
    $('#simOut').innerHTML = `<div class="grid g3"><div class="kpi"><div class="l">À vista</div><div class="v">${R(vista)}</div></div><div class="kpi"><div class="l">Parcelado</div><div class="v">${n}× ${R(parc)}</div><div class="d">total ${R(totParc)} · valor presente ${R(vp)}</div></div><div class="kpi"><div class="l">Melhor opção</div><div class="v ok">${melhor}</div><div class="d">diferença ${R(Math.abs(vp - vista))} em valor de hoje</div></div></div>
      ${folga !== null ? `<div class="alert ${parc > folga ? 'w' : 'o'}" style="margin-top:10px"><span>${parc > folga ? '⚠️' : '✅'}</span><div class="t">A parcela de ${R(parc)} ${parc > folga ? 'é maior que' : 'cabe na'} folga prevista do orçamento deste mês (${R(folga)}).</div></div>` : ''}`;
  },
  simMeta(){ const v = num('sg_v'), n = Math.max(1, Math.round(num('sg_n'))), r = num('sg_r')/100;
    const pm = r > 0 ? v * r / (Math.pow(1 + r, n) - 1) : v / n;
    $('#metaOut').innerHTML = `<div class="kpi"><div class="l">Guardar por mês</div><div class="v">${R(pm)}</div><div class="d">${n} aportes · juros ganhos ${R(v - pm*n)}${renda() ? ` · ${P(pm/renda()*100)} da renda` : ''}</div></div>`; },
  simAnual(){ const m = num('pa_m'), a = num('pa_a'), u = Math.max(1, Math.round(num('pa_u')));
    const custoMensal = m * u, eco = custoMensal - a;
    $('#anualOut').innerHTML = `<div class="alert ${eco > 0 ? 'o' : 'w'}"><span>${eco > 0 ? '✅' : '⚠️'}</span><div class="t">${eco > 0 ? `Plano anual compensa: economia de <b>${R(eco)}</b> (${P(eco/custoMensal*100)}).` : `Plano mensal é melhor se for usar só ${u} mês(es): diferença de <b>${R(-eco)}</b>.`}<br><span class="muted">Ponto de equilíbrio: ${m ? N(a/m) : '—'} meses de uso.</span></div></div>`; },
  payback(){ const i = num('pb_inv'), e = num('pb_eco'), v = num('pb_vida');

  addContrato(){ const v = num('ct_val'); if (!val('ct_nome') || !(v > 0)) return toast('Informe serviço e valor');

  addConsumo(){ const q = num('cs_qtd'); if (!(q > 0) || !val('cs_mes')) return toast('Informe mês e quantidade');

  recFeita(k){ const r = recomendacoes(MES).find(x => x.k === k); S.recStatus[k] = 'feito';

  async aportar(id){ const m = S.metas.find(x => x.id === id); const v = numIn(await ask('Aporte', `Quanto aportar em <b>${esc(m.nome)}</b>? (R$)`, {input:true, num:true, ok:'Aportar'}) || ''); if (v){ m.atual += v; save(); render(); } },
  async editReserva(){ const v = await ask('Reserva de emergência', 'Valor atual da reserva (R$):', {input:true, num:true, valor:N(S.casa.reserva, 2), ok:'Salvar'}); if (v !== null){ S.casa.reserva = numIn(v); save(); render(); } },

  csv(tx){ return '﻿data;descricao;categoria;consumido_por;pago_por;valor\n' + tx.sort((a, b) => a.data.localeCompare(b.data)).map(t => [t.data, `"${t.desc.replace(/"/g, '""')}"`, cat(t.cat).nome, nomeQuem(t.quem), nomeQuem(t.pagou), N(t.valor, 2).replace(/\./g, '')].join(';')).join('\n'); },

    tx(m, 11, 'Posto Shell gasolina', 240 + rnd()*40, 'transporte', 'casa', 'm2'); tx(m, 25, 'Posto Ipiranga', 230 + rnd()*40, 'transporte', 'casa', 'm2');
    tx(m, 14, 'Drogaria Raia', 60 + rnd()*90, 'saude', 'casa', 'm1');
    tx(m, 18, ['Cinema', 'Parque', 'Teatro', 'Show', 'Boliche', 'Cinema'][k], 90 + rnd()*120, 'lazer', 'casa', 'm1');

  s.metas = [{id:uid(), nome:'Viagem de férias', alvo:9000, atual:2600, prazo:addM(HOJE_YM, 8)}, {id:uid(), nome:'Trocar o sofá', alvo:3500, atual:900, prazo:addM(HOJE_YM, 5)}];
  s.economias = [{id:uid(), data:`${addM(HOJE_YM, -2)}-10`, desc:'Cancelada assinatura HBO Max', valor:39.9}];
