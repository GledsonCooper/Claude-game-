<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinOps Casa</title>
<meta name="description" content="FinOps residencial: Informar, Otimizar e Operar os custos da sua casa.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--ink:#1b1f24;--muted:#5d6672;--line:#e1e4e8;
  --brand:#0f766e;--brand2:#14b8a6;--brandInk:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;
  --okBg:#dcfce7;--warnBg:#fef3c7;--badBg:#fee2e2;--infoBg:#dbeafe;--bar:#0f766e;--bar2:#94a3b8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--panel:#171b21;--panel2:#1f242b;--ink:#e6e9ed;--muted:#9aa3ae;--line:#2b313a;
  --brand:#2dd4bf;--brand2:#14b8a6;--brandInk:#06201d;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
  --okBg:#12301e;--warnBg:#3a2c0b;--badBg:#3b1515;--infoBg:#14254a;--bar:#2dd4bf;--bar2:#475569;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1216;--panel:#171b21;--panel2:#1f242b;--ink:#e6e9ed;--muted:#9aa3ae;--line:#2b313a;
  --brand:#2dd4bf;--brand2:#14b8a6;--brandInk:#06201d;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
  --okBg:#12301e;--warnBg:#3a2c0b;--badBg:#3b1515;--infoBg:#14254a;--bar:#2dd4bf;--bar2:#475569;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:auto;cursor:pointer}
.logo small{font-weight:500;color:var(--muted);font-size:12px}
.month{display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:10px;padding:2px}
.month b{min-width:118px;text-align:center;font-size:14px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:10px 8px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav h4{margin:14px 10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--brand);color:var(--brandInk);font-weight:600}
main{padding:20px;max-width:1150px;width:100%;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-weight:600;vertical-align:middle}
.tag.i{background:var(--infoBg);color:var(--info)}.tag.o{background:var(--okBg);color:var(--ok)}.tag.w{background:var(--warnBg);color:var(--warn)}.tag.b{background:var(--badBg);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted)}
.mb{margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel2)}
button.p{background:var(--brand);color:var(--brandInk);border-color:var(--brand);font-weight:600}
button.p:hover{filter:brightness(1.08)}
button.s{padding:3px 8px;font-size:12.5px}
button.x{border:none;background:none;color:var(--muted);padding:3px 6px}
button.x:hover{color:var(--bad)}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:12.5px}
label{font-size:12.5px;color:var(--muted);display:block}
label>input,label>select,label>textarea{margin-top:3px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--bar);border-radius:99px}
.bar>i.w{background:var(--warn)}.bar>i.b{background:var(--bad)}.bar>i.o{background:var(--ok)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.hb .bar{height:12px}
.alert{border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.alert.w{background:var(--warnBg)}.alert.b{background:var(--badBg)}.alert.o{background:var(--okBg)}.alert.i{background:var(--infoBg)}
.alert .t{flex:1}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}
.hero h1{color:#fff}.hero p{opacity:.95}
.hero button{background:#fff;color:#0f766e;border:none;font-weight:600}
.phase{border-left:4px solid var(--brand);padding-left:12px}
.check{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;flex:none}
.check .t{flex:1}
dialog{border:none;border-radius:16px;padding:0;background:var(--panel);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex}
dialog .bd{padding:16px;display:grid;gap:10px}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:var(--panel2);font-size:13px}
.lvl{display:flex;gap:6px}.lvl span{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:13px;color:var(--muted)}
.lvl span.on{background:var(--brand);color:var(--brandInk)}
details summary{cursor:pointer;font-weight:600}
.fab{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;border-right:none;border-bottom:1px solid var(--line);padding:8px 16px;z-index:10}
  nav h4{display:none}
  nav a{flex:none;padding:6px 10px;background:var(--panel2)}
  main{padding:16px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
  header{padding:8px 16px}
  .hdadd{display:none}
  .fab{display:block;position:fixed;right:16px;bottom:16px;z-index:30;border-radius:99px;padding:14px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .hb{grid-template-columns:90px 1fr auto}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('painel')">🏠 FinOps Casa <small id="casaNome"></small></div>
  <div class="month">
    <button class="x" onclick="A.mes(-1)" aria-label="Mês anterior">◀</button>
    <b id="mesLbl"></b>
    <button class="x" onclick="A.mes(1)" aria-label="Próximo mês">▶</button>
  </div>
  <button class="p hdadd" onclick="A.novoGasto()">+ Lançar gasto</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<button class="p fab" onclick="A.novoGasto()">+ Gasto</button>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ====================== Utilidades ====================== */
const KEY = 'finopsCasa.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const R0 = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const N = (v, d = 1) => (Number(v) || 0).toLocaleString('pt-BR', {maximumFractionDigits:d});
const P = v => isFinite(v) ? N(v, 0) + '%' : '—';
const sum = a => a.reduce((s, x) => s + (Number(x) || 0), 0);
const pad2 = n => String(n).padStart(2, '0');
const hoje = new Date();
const HOJE = `${hoje.getFullYear()}-${pad2(hoje.getMonth()+1)}-${pad2(hoje.getDate())}`;
const HOJE_YM = HOJE.slice(0, 7);
const ymOf = d => String(d).slice(0, 7);
function addM(ym, k){ let [y, m] = ym.split('-').map(Number); m += k; while (m > 12){ m -= 12; y++; } while (m < 1){ m += 12; y--; } return `${y}-${pad2(m)}`; }
const diasNoMes = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const nomeMes = (ym, curto) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('pt-BR', curto ? {month:'short'} : {month:'long', year:'numeric'}).replace('.', ''); };
const dataBR = d => d ? d.split('-').reverse().join('/') : '';
const meses = (fim, n) => Array.from({length:n}, (_, i) => addM(fim, i - n + 1));
function num(id){ const el = document.getElementById(id); return el ? parseFloat(String(el.value).replace(/\./g, '').replace(',', '.')) || 0 : 0; }
function numIn(v){ const s = String(v).trim(); if (s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0; return parseFloat(s) || 0; }
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }

/* ====================== Modelo de dados ====================== */
const CATS = [
  ['moradia','🏠','Moradia (aluguel/condomínio)','fixo','essencial'],
  ['energia','⚡','Energia elétrica','fixo','essencial'],
  ['agua','💧','Água e esgoto','fixo','essencial'],
  ['gas','🔥','Gás','variavel','essencial'],
  ['internet','📶','Internet & telefone','fixo','essencial'],
  ['mercado','🛒','Mercado','variavel','essencial'],
  ['transporte','🚗','Transporte','variavel','essencial'],
  ['saude','🩺','Saúde & farmácia','variavel','essencial'],
  ['educacao','📚','Educação','fixo','essencial'],
  ['impostos','🧾','Impostos & seguros','fixo','essencial'],
  ['manutencao','🔧','Manutenção da casa','variavel','essencial'],
  ['pets','🐾','Pets','variavel','essencial'],
  ['restaurantes','🍽️','Restaurantes & delivery','variavel','estilo'],
  ['assinaturas','📺','Assinaturas & apps','fixo','estilo'],
  ['lazer','🎉','Lazer & viagens','variavel','estilo'],
  ['vestuario','👕','Vestuário & compras','variavel','estilo'],
  ['tarifas','🏦','Juros, tarifas & multas','variavel','estilo'],
  ['outros','❓','Sem categoria','variavel','estilo'],
].map(([id, icone, nome, tipo, grupo]) => ({id, icone, nome, tipo, grupo}));

const AUTO = [
  ['aluguel|condom|imobili','moradia'],
  ['enel|light|cemig|copel|celesc|coelba|energisa|cpfl|equatorial|neoenergia|eletropaulo|energia','energia'],
  ['sabesp|cedae|copasa|sanepar|embasa|compesa|caesb|água|agua','agua'],
  ['comgas|ultragaz|liquigas|supergasbras|gás|botijao|botijão','gas'],
  ['vivo|claro|tim|oi |net |fibra|internet|celular','internet'],
  ['mercado|supermerc|carrefour|assai|assaí|atacad|pão de açúcar|extra|hortifruti|sacolão|padaria','mercado'],
  ['uber|99app|99 |posto|ipiranga|shell|combust|gasolina|estacion|metrô|metro|ônibus|bilhete','transporte'],
  ['farm|drogaria|droga|raia|pacheco|médic|medic|hospital|clínica|clinica|plano de saúde|unimed|amil|dentista','saude'],
  ['escola|faculdade|curso|udemy|alura|inglês|ingles','educacao'],
  ['iptu|ipva|seguro|licenciamento|darf','impostos'],
  ['leroy|telhanorte|eletricista|encanador|reforma|conserto|material de constru','manutencao'],
  ['petz|cobasi|petshop|pet shop|veterin|ração|racao','pets'],
  ['ifood|rappi|restaurante|lanchonete|burger|pizza|bar |café|cafe','restaurantes'],
  ['netflix|spotify|disney|prime|hbo|max|globoplay|youtube|deezer|apple|icloud|google one|microsoft|academia|smartfit|gympass|wellhub|chatgpt|claude','assinaturas'],
  ['cinema|ingresso|show|viagem|hotel|airbnb|passagem|latam|gol |azul','lazer'],
  ['renner|riachuelo|c&a|zara|shein|shopee|amazon|mercado livre|magalu|americanas|loja','vestuario'],
  ['juros|tarifa|iof|multa|anuidade|encargo|cheque especial|mora','tarifas'],
];

const RITUAL = [
  ['ingest','Lançar ou importar todas as despesas do mês','lancamentos','Ingestão de dados'],
  ['aloc','Conferir categorias e quem consumiu cada gasto','alocacao','Alocação'],
  ['anom','Revisar anomalias e cobranças duplicadas','anomalias','Gestão de anomalias'],
  ['orc','Comparar real × orçamento e ajustar a previsão','orcamento','Orçamento & Previsão'],
  ['subs','Revisar assinaturas e cancelar as ociosas','assinaturas','Licenças & SaaS'],
  ['uso','Registrar leituras de luz, água e gás','consumo','Otimização de uso'],
  ['rateio','Fazer o acerto entre os moradores','alocacao','Faturamento & Chargeback'],
  ['rec','Aplicar pelo menos 1 recomendação de economia','recomendacoes','Otimização'],
  ['metas','Atualizar metas e reserva de emergência','valor','Quantificar valor'],
  ['reuniao','Conversa de 15 min com a família sobre os números','aprender','Educação & cultura'],
];

function defaults(){
  return {
    v:1, onboarded:false,
    casa:{nome:'Minha casa', area:70, reserva:0, fatorCO2:0.05},
    moradores:[{id:'m1', nome:'Eu', peso:1, renda:0}],
    categorias:JSON.parse(JSON.stringify(CATS)),
    transacoes:[], orcamentos:{}, consumos:[], assinaturas:[], contratos:[], metas:[], economias:[], planejados:[],
    regras:{alertaOrc:80, anomaliaPct:30, limiteCompra:500, essencialMax:50, estiloMax:30, poupancaMin:20, moradiaMax:30},
    autoCat:JSON.parse(JSON.stringify(AUTO)),
    ritual:{}, recStatus:{}
  };
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v) return Object.assign(defaults(), s); } catch(e) {}
  return defaults();
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast('Não foi possível salvar no navegador'); } }

let MES = HOJE_YM;
let ROTA = 'painel';
let FILTRO = {cat:'', q:''};

/* ====================== Cálculos ====================== */
const cat = id => S.categorias.find(c => c.id === id) || S.categorias.find(c => c.id === 'outros') || {id:'outros', icone:'❓', nome:'Sem categoria', tipo:'variavel', grupo:'estilo'};
const membro = id => S.moradores.find(m => m.id === id);
const nomeQuem = id => id === 'casa' ? 'Casa (compartilhado)' : (membro(id)?.nome || '—');
const txMes = m => S.transacoes.filter(t => ymOf(t.data) === m);
const totalMes = m => sum(txMes(m).map(t => t.valor));
function porCat(m){ const o = {}; for (const t of txMes(m)) o[t.cat] = (o[t.cat] || 0) + t.valor; return o; }
const mesesComDados = () => [...new Set(S.transacoes.map(t => ymOf(t.data)))].sort();
const renda = () => sum(S.moradores.map(m => m.renda));
function mediaCat(m, n = 3){
  const ms = meses(addM(m, -1), n).filter(x => txMes(x).length);
  const o = {}; if (!ms.length) return o;
  for (const x of ms){ const pc = porCat(x); for (const k in pc) o[k] = (o[k] || 0) + pc[k]; }
  for (const k in o) o[k] /= ms.length;
  return o;
}
function mediaTotal(m, n = 3){ const ms = meses(addM(m, -1), n).filter(x => txMes(x).length); return ms.length ? sum(ms.map(totalMes)) / ms.length : 0; }
const planejadosAtivos = m => S.planejados.filter(p => p.inicio <= m && (!p.fim || p.fim >= m));

function previsao(m){
  const real = porCat(m), hist = mediaCat(m, 3);
  const dias = diasNoMes(m);
  const passado = m < HOJE_YM, futuro = m > HOJE_YM;
  const dec = passado ? dias : futuro ? 0 : hoje.getDate();
  const det = {};
  for (const c of S.categorias){
    const r = real[c.id] || 0, h = hist[c.id] || 0;
    let v;
    if (passado) v = r;
    else if (c.tipo === 'fixo') v = Math.max(r, h);
    else v = r + h * (dias - dec) / dias;
    if (v) det[c.id] = v;
  }
  if (!passado) for (const p of planejadosAtivos(m)) det[p.cat] = (det[p.cat] || 0) + p.valor;
  return {total:sum(Object.values(det)), det};
}

function anomalias(m){
  const out = [], pct = S.regras.anomaliaPct;
  const real = porCat(m), hist = mediaCat(m, 3);
  for (const c of S.categorias){
    const r = real[c.id] || 0, h = hist[c.id] || 0;
    if (h > 0 && r > h * (1 + pct/100) && r - h > 30)
      out.push({sev: r > h*2 ? 'b' : 'w', tipo:'Categoria acima do normal', txt:`${c.icone} ${c.nome}: ${R(r)} contra média de ${R(h)} (+${P((r/h-1)*100)})`, impacto:r-h});
    else if (!h && r > 200 && Object.keys(hist).length && c.id !== 'outros')
      out.push({sev:'i', tipo:'Gasto novo', txt:`${c.icone} ${c.nome}: ${R(r)} sem histórico nos últimos 3 meses`, impacto:r});
  }
  const seis = meses(m, 6);
  const tx = txMes(m);
  for (const t of tx){
    if (cat(t.cat).tipo === 'fixo') continue;
    const hist6 = S.transacoes.filter(x => x.cat === t.cat && x.id !== t.id && seis.includes(ymOf(x.data))).map(x => x.valor).sort((a, b) => a - b);
    if (hist6.length >= 3){
      const med = hist6[Math.floor(hist6.length/2)];
      if (t.valor > med * 3 && t.valor > 100) out.push({sev:'w', tipo:'Valor fora do padrão', txt:`${t.desc} (${dataBR(t.data)}): ${R(t.valor)} — normalmente ${R(med)} em ${cat(t.cat).nome}`, impacto:t.valor-med, tx:t.id});
    }
  }
  const vistos = new Set();
  for (const a of tx) for (const b of tx){
    if (a.id >= b.id) continue;
    const k = [a.id, b.id].join();
    if (vistos.has(k)) continue;
    if (Math.abs(a.valor - b.valor) < 0.01 && a.desc.trim().toLowerCase() === b.desc.trim().toLowerCase() && Math.abs(new Date(a.data) - new Date(b.data)) <= 3*864e5){
      vistos.add(k);
      out.push({sev:'b', tipo:'Possível cobrança duplicada', txt:`${a.desc}: ${R(a.valor)} em ${dataBR(a.data)} e ${dataBR(b.data)}`, impacto:a.valor, tx:b.id});
    }
  }
  return out.sort((a, b) => b.impacto - a.impacto);
}

const mensalAss = a => a.ciclo === 'anual' ? a.valor/12 : a.valor;

function consumoRef(tipo){ return {energia:{un:'kWh', ref:100, nome:'Energia', ic:'⚡'}, agua:{un:'m³', ref:4, nome:'Água', ic:'💧'}, gas:{un:'m³/kg', ref:4, nome:'Gás', ic:'🔥'}}[tipo]; }
function pessoas(){ return Math.max(1, sum(S.moradores.map(m => m.peso >= 1 ? 1 : (m.peso || 0) > 0 ? 1 : 0)) || S.moradores.length); }

function recomendacoes(m){
  const recs = [];
  for (const a of S.assinaturas){
    if (a.uso === 'nenhum' || a.uso === 'baixo')
      recs.push({k:'ass-cancel-'+a.id, area:'Licenças & SaaS', titulo:`Cancelar ou pausar ${a.nome}`, det:`Uso ${a.uso === 'nenhum' ? 'nenhum' : 'baixo'} nos últimos 30 dias. Custo: ${R(mensalAss(a))}/mês (${R(mensalAss(a)*12)}/ano).`, eco:mensalAss(a), esf:'Baixo'});
    else if (a.ciclo === 'mensal' && a.uso === 'alto' && a.valor >= 20)
      recs.push({k:'ass-anual-'+a.id, area:'Otimização de tarifas', titulo:`Avaliar plano anual de ${a.nome}`, det:`Uso alto e pagamento mensal. Planos anuais costumam sair ~15% mais baratos (compromisso = "reserva" da nuvem).`, eco:a.valor*0.15, esf:'Baixo'});
  }
  const streaming = S.assinaturas.filter(a => /netflix|disney|prime|hbo|max|globo|paramount|apple tv|star/i.test(a.nome));
  if (streaming.length >= 3){
    const menor = Math.min(...streaming.map(mensalAss));
    recs.push({k:'ass-rodizio', area:'Licenças & SaaS', titulo:`Rodízio de streaming (${streaming.length} ativos)`, det:`Mantenha 1–2 por vez e alterne a cada mês. Economia estimada: o menor deles.`, eco:menor, esf:'Médio'});
  }
  for (const c of S.contratos){
    if (c.valorAlt > 0 && c.valorAlt < c.valor)
      recs.push({k:'ctr-'+c.id+'-'+c.valorAlt, area:'Otimização de tarifas', titulo:`Renegociar/trocar: ${c.nome}`, det:`Hoje ${R(c.valor)}/mês com ${esc(c.fornecedor||'fornecedor atual')}. Alternativa: ${esc(c.alternativa||'oferta')} por ${R(c.valorAlt)}.`, eco:c.valor - c.valorAlt, esf:'Médio'});
  }
  const ult = meses(m, 3).map(x => S.consumos.filter(c => c.mes === x));
  for (const tipo of ['energia','agua','gas']){
    const regs = S.consumos.filter(c => c.tipo === tipo && c.mes <= m).sort((a, b) => a.mes < b.mes ? 1 : -1);
    if (!regs.length) continue;
    const r = regs[0], ref = consumoRef(tipo), pp = r.qtd / pessoas();
    if (pp > ref.ref * 1.2 && r.custo > 0){
      const ecoU = r.custo * Math.min(0.25, 1 - (ref.ref * pessoas()) / r.qtd);
      recs.push({k:'uso-'+tipo+'-'+r.mes, area:'Otimização de uso', titulo:`Reduzir consumo de ${ref.nome.toLowerCase()}`, det:`${N(pp)} ${ref.un}/pessoa em ${nomeMes(r.mes, true)}, acima da referência de ~${ref.ref} ${ref.un}/pessoa. Veja dicas em Consumo.`, eco:ecoU, esf:'Médio'});
    }
  }
  const taxas = txMes(m).filter(t => t.cat === 'tarifas');
  if (taxas.length){
    const v = sum(taxas.map(t => t.valor));
    recs.push({k:'taxas-'+m, area:'Eliminar desperdício', titulo:'Zerar juros, tarifas e multas', det:`${taxas.length} cobrança(s) em ${nomeMes(m)} somando ${R(v)}. Peça isenção do pacote bancário, use conta digital e pague em dia (débito automático).`, eco:v, esf:'Baixo'});
  }
  const pv = previsao(m);
  for (const c of S.categorias){
    const o = S.orcamentos[c.id] || 0, p = pv.det[c.id] || 0;
    if (o > 0 && p > o * 1.1 && c.grupo === 'estilo')
      recs.push({k:'orc-'+c.id+'-'+m, area:'Orçamento', titulo:`Segurar ${c.nome.toLowerCase()}`, det:`Previsão de ${R(p)} para orçamento de ${R(o)}. Defina um teto semanal de ${R(o/4.3)}.`, eco:p - o, esf:'Médio'});
  }
  const st = S.recStatus;
  return recs.filter(r => r.eco > 0.5).map(r => ({...r, status:st[r.k] || ''})).sort((a, b) => (a.status ? 1 : 0) - (b.status ? 1 : 0) || b.eco - a.eco);
}

function violacoes(m){
  const v = [], rg = S.regras, tx = txMes(m);
  const grandes = tx.filter(t => t.valor > rg.limiteCompra && !t.aprovada && cat(t.cat).tipo !== 'fixo');
  for (const t of grandes) v.push({sev:'w', pol:'Aprovação de compras grandes', txt:`${t.desc} — ${R(t.valor)} em ${dataBR(t.data)} acima de ${R(rg.limiteCompra)} sem aprovação`, acao:`<button class="s" onclick="A.aprovar('${t.id}')">Aprovar</button>`});
  const sem = tx.filter(t => t.cat === 'outros');
  if (sem.length) v.push({sev:'w', pol:'Todo gasto deve ter categoria', txt:`${sem.length} lançamento(s) sem categoria (${R(sum(sem.map(t => t.valor)))})`, acao:`<button class="s" onclick="A.filtrar('outros')">Categorizar</button>`});
  const pv = previsao(m);
  for (const c of S.categorias){
    const o = S.orcamentos[c.id] || 0, r = porCat(m)[c.id] || 0;
    if (o > 0 && r >= o * rg.alertaOrc/100) v.push({sev: r > o ? 'b' : 'w', pol:`Alerta de orçamento (${rg.alertaOrc}%)`, txt:`${c.icone} ${c.nome}: ${R(r)} de ${R(o)} (${P(r/o*100)})`});
  }
  const rd = renda();
  if (rd > 0){
    const g = grupos(m, true);
    if (g.essencial/rd*100 > rg.essencialMax) v.push({sev:'w', pol:`Essenciais ≤ ${rg.essencialMax}% da renda`, txt:`Previsto ${P(g.essencial/rd*100)} da renda em essenciais`});
    if (g.estilo/rd*100 > rg.estiloMax) v.push({sev:'w', pol:`Estilo de vida ≤ ${rg.estiloMax}% da renda`, txt:`Previsto ${P(g.estilo/rd*100)} da renda em estilo de vida`});
    const poup = (rd - pv.total)/rd*100;
    if (poup < rg.poupancaMin) v.push({sev: poup < 0 ? 'b' : 'w', pol:`Poupança ≥ ${rg.poupancaMin}% da renda`, txt:`Previsão de poupança: ${P(poup)} (${R(rd - pv.total)})`});
    const mor = (pv.det.moradia || 0)/rd*100;
    if (mor > rg.moradiaMax) v.push({sev:'w', pol:`Moradia ≤ ${rg.moradiaMax}% da renda`, txt:`Moradia consome ${P(mor)} da renda`});
  }
  return v;
}

function grupos(m, prev){
  const det = prev ? previsao(m).det : porCat(m); const o = {essencial:0, estilo:0};
  for (const k in det) o[cat(k).grupo] += det[k];
  return o;
}

function rateio(m){
  const tx = txMes(m), ms = S.moradores, pesoT = sum(ms.map(x => x.peso)) || 1;
  const linhas = ms.map(x => ({id:x.id, nome:x.nome, ind:0, comp:0, pagou:0}));
  const L = id => linhas.find(l => l.id === id);
  for (const t of tx){
    if (t.quem === 'casa' || !L(t.quem)) for (const l of linhas) l.comp += t.valor * (membro(l.id).peso || 0) / pesoT;
    else L(t.quem).ind += t.valor;
    const pg = L(t.pagou) || linhas[0];
    if (pg) pg.pagou += t.valor;
  }
  for (const l of linhas){ l.total = l.ind + l.comp; l.devido = l.total; }
  // dependentes (sem renda) aparecem no showback, mas seu custo é bancado pelos que têm renda (proporcional ao peso)
  const pagantes = linhas.filter(l => (membro(l.id).renda || 0) > 0), pesoP = sum(pagantes.map(l => membro(l.id).peso || 0));
  if (pagantes.length && pesoP > 0) for (const l of linhas) if (!((membro(l.id).renda || 0) > 0)){
    l.dep = true; for (const p of pagantes) p.devido += l.total * (membro(p.id).peso || 0) / pesoP; l.devido = 0;
  }
  for (const l of linhas) l.saldo = l.pagou - l.devido;
  const dev = linhas.filter(l => l.saldo < -0.5).map(l => ({...l, r:-l.saldo})), cre = linhas.filter(l => l.saldo > 0.5).map(l => ({...l, r:l.saldo}));
  const acertos = [];
  for (const d of dev) for (const c of cre){
    const v = Math.min(d.r, c.r); if (v < 0.5) continue;
    acertos.push({de:d.nome, para:c.nome, v}); d.r -= v; c.r -= v;
  }
  return {linhas, acertos};
}

function maturidade(){
  const m = HOJE_YM, ant = addM(m, -1);
  const tx = S.transacoes, txm = txMes(m).length ? txMes(m) : txMes(ant);
  const alocPct = txm.length ? txm.filter(t => t.cat !== 'outros').length / txm.length * 100 : 0;
  const rit = Math.max(...[m, ant].map(x => Object.values(S.ritual[x] || {}).filter(Boolean).length)) / RITUAL.length * 100;
  const c = [
    ['Informar','Gastos lançados no mês atual ou anterior', txm.length >= 5, 'lancamentos'],
    ['Informar','≥ 90% dos gastos categorizados (alocação)', alocPct >= 90, 'alocacao'],
    ['Informar','Moradores cadastrados com peso de rateio', S.moradores.length >= 1 && S.moradores.some(x => x.nome !== 'Eu'), 'config'],
    ['Informar','3+ meses de histórico (base para anomalias)', mesesComDados().length >= 3, 'relatorios'],
    ['Informar','Renda informada (unit economics e % da renda)', renda() > 0, 'config'],
    ['Otimizar','Orçamento definido para 5+ categorias', Object.values(S.orcamentos).filter(v => v > 0).length >= 5, 'orcamento'],
    ['Otimizar','Assinaturas inventariadas com nível de uso', S.assinaturas.length >= 1, 'assinaturas'],
    ['Otimizar','Contratos com alternativa cotada', S.contratos.some(x => x.valorAlt > 0), 'tarifas'],
    ['Otimizar','Leituras de consumo registradas', S.consumos.length >= 1, 'consumo'],
    ['Otimizar','Pelo menos 1 economia aplicada', S.economias.length >= 1, 'recomendacoes'],
    ['Operar','Ritual mensal ≥ 80% concluído', rit >= 80, 'ritual'],
    ['Operar','Metas financeiras definidas', S.metas.length >= 1, 'valor'],
    ['Operar','Reserva de emergência registrada', S.casa.reserva > 0, 'valor'],
    ['Operar','Políticas revisadas (limite de compra definido)', S.regras.limiteCompra > 0 && S.onboarded, 'governanca'],
  ];
  const score = Math.round(c.filter(x => x[2]).length / c.length * 100);
  const nivel = score < 40 ? 0 : score < 75 ? 1 : 2;
  return {c, score, nivel};
}

/* ====================== Gráficos ====================== */
function barChart(labels, values, opt = {}){
  const w = 640, h = 210, pl = 8, pr = 8, pt = 18, pb = 26;
  const max = Math.max(1, ...values, ...(opt.line || []).filter(Boolean)) * 1.1;
  const bw = (w - pl - pr) / values.length;
  const y = v => pt + (h - pt - pb) * (1 - v/max);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.label || 'Gráfico')}">`;
  s += `<line x1="${pl}" x2="${w-pr}" y1="${h-pb}" y2="${h-pb}" stroke="var(--line)"/>`;
  values.forEach((v, i) => {
    const x = pl + i*bw + bw*0.18, bh = (h - pt - pb) - (y(v) - pt);
    const fill = opt.colors?.[i] || 'var(--bar)';
    s += `<rect x="${x}" y="${y(v)}" width="${bw*0.64}" height="${Math.max(0, bh)}" rx="4" fill="${fill}"><title>${esc(labels[i])}: ${R(v)}</title></rect>`;
    s += `<text x="${x + bw*0.32}" y="${h-8}" text-anchor="middle">${esc(labels[i])}</text>`;
    if (v > 0 && values.length <= 12) s += `<text x="${x + bw*0.32}" y="${y(v) - 4}" text-anchor="middle">${N(v/1000, 1)}k</text>`;
  });
  if (opt.line){
    const pts = opt.line.map((v, i) => v ? `${pl + i*bw + bw/2},${y(v)}` : null).filter(Boolean);
    if (pts.length > 1) s += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>`;
    else if (pts.length === 1) s += `<circle cx="${pts[0].split(',')[0]}" cy="${pts[0].split(',')[1]}" r="4" fill="var(--warn)"/>`;
  }
  return s + '</svg>';
}
function hbars(rows, max){
  max = max || Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hb"><span title="${esc(r.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.l}</span><div class="bar"><i class="${r.c || ''}" style="width:${Math.min(100, r.v/max*100)}%"></i></div><b class="n" style="font-variant-numeric:tabular-nums">${r.t ?? R(r.v)}</b></div>`).join('');
}
const pbar = (v, o) => { const p = o > 0 ? v/o*100 : 0; const c = p > 100 ? 'b' : p >= S.regras.alertaOrc ? 'w' : 'o'; return `<div class="bar"><i class="${c}" style="width:${Math.min(100, p)}%"></i></div>`; };
const kpi = (l, v, d = '', cls = '') => `<div class="card kpi"><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="d">${d}</div></div>`;
const catOpts = sel => S.categorias.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${c.icone} ${esc(c.nome)}</option>`).join('');
const quemOpts = (sel, casa = true) => (casa ? `<option value="casa" ${sel === 'casa' ? 'selected' : ''}>🏠 Casa (compartilhado)</option>` : '') + S.moradores.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.nome)}</option>`).join('');
const head = (t, s, fase) => `<h1>${t} ${fase ? `<span class="tag i">${fase}</span>` : ''}</h1><p class="sub">${s}</p>`;

      ['Planejamento & Estimativa','Novos gastos planejados e simulador à vista × parcelado','planejamento'],
      ['Previsão (Forecasting)','Previsão do fechamento do mês e dos próximos 3 meses','orcamento'],
      ['Orçamento (Budgeting)','Orçamento por categoria com alertas','orcamento'],
      ['Benchmarking','Regra 50/30/20, moradia × renda, mês × média histórica','benchmark'],
      ['Economia unitária','Custo por morador, por m², por dia, R$/kWh, R$/m³, % da renda','unitarios']]],
    ['Otimizar uso e custo','Otimizar',[
      ['Arquitetura (decisões estruturais)','Calculadora de payback de melhorias (LED, solar, eletrodomésticos)','consumo'],
      ['Otimização de uso (rightsizing)','Leituras de luz/água/gás, consumo por pessoa e dicas','consumo'],
      ['Otimização de tarifas','Contratos × alternativas, plano anual × mensal','tarifas'],

      ['Avaliação (Assessment)','Nível de maturidade Engatinhar/Andar/Correr','maturidade'],
      ['Ferramentas & Serviços','Este app + exportação/importação de dados','config'],
      ['Educação & Capacitação','Princípios, glossário e papéis na família','aprender'],
      ['Faturamento & Chargeback','Showback por morador e acerto de contas (quem paga quem)','alocacao'],
      ['Onboarding de cargas','Entrada de novos gastos recorrentes no planejamento','planejamento'],
      ['Disciplinas que se cruzam','Impostos, seguros e investimentos (em Aprender)','aprender']]],
  ];
  return head('Mapa FinOps', 'Como cada domínio e capacidade do FinOps Framework foi traduzido para a casa — clique para ir à tela.') + `
  <div class="grid g3 mb">
    <div class="card phase"><h2>1 · Informar</h2><p class="muted" style="margin:0">Visibilidade e alocação: saber exatamente quanto, onde e quem gasta.</p></div>
    <div class="card phase"><h2>2 · Otimizar</h2><p class="muted" style="margin:0">Pagar menos pelo mesmo (tarifas) e usar só o necessário (uso).</p></div>
    <div class="card phase"><h2>3 · Operar</h2><p class="muted" style="margin:0">Regras, rituais e cultura para a economia durar.</p></div>
  </div>` + dom.map(([d, f, caps]) => `<div class="card"><h2>${d} <span class="tag i">${f}</span></h2><div class="tw"><table><tr><th>Capacidade FinOps</th><th>Na sua casa</th><th></th></tr>${caps.map(([c, t, r]) => `<tr><td><b>${c}</b></td><td class="muted">${t}</td><td class="n"><a href="#${r}">abrir →</a></td></tr>`).join('')}</table></div></div>`).join('');
};

V.lancamentos = () => {
  const m = MES;
  let tx = txMes(m).sort((a, b) => b.data.localeCompare(a.data));
  if (FILTRO.cat) tx = tx.filter(t => t.cat === FILTRO.cat);
  if (FILTRO.q) tx = tx.filter(t => t.desc.toLowerCase().includes(FILTRO.q.toLowerCase()));
  const dia = m === HOJE_YM ? HOJE : `${m}-01`;
  return head('Lançamentos', 'Ingestão de dados: tudo que sai da conta da casa entra aqui — à mão ou importando o extrato do banco.', 'Informar') + `
  <div class="card"><h2>Lançamento rápido</h2>
  <div class="form">
    <label>Data<input type="date" id="q_data" value="${dia}"></label>
    <label style="grid-column:span 2">Descrição<input id="q_desc" placeholder="ex.: Mercado Assaí" oninput="A.sugCat(this.value,'q_cat')"></label>
    <label>Valor (R$)<input id="q_val" inputmode="decimal" placeholder="0,00" onkeydown="if(event.key==='Enter')A.addRapido()"></label>
    <label>Categoria<select id="q_cat">${catOpts('outros')}</select></label>
    <label>Quem consumiu<select id="q_quem">${quemOpts('casa')}</select></label>
    <label>Quem pagou<select id="q_pagou">${quemOpts(S.moradores[0]?.id, false)}</select></label>
    <button class="p" onclick="A.addRapido()">Adicionar</button>
  </div></div>
  <details class="card"><summary>📄 Importar extrato (CSV)</summary>
    <p class="muted" style="font-size:13.5px">Exporte o extrato do banco/cartão em CSV com colunas <b>data, descrição, valor</b> (qualquer ordem, com cabeçalho). Se houver valores negativos, só os negativos (débitos) são importados. Duplicados são ignorados e a categoria é sugerida pelas <a href="#governanca">regras automáticas</a>.</p>
    <div class="row mb"><input type="file" id="csvFile" accept=".csv,.txt" style="max-width:320px" onchange="A.lerArquivo(this)"></div>
    <textarea id="csvTxt" placeholder="data;descrição;valor&#10;05/11/2026;Mercado Assaí;-312,45&#10;06/11/2026;Uber;-23,90"></textarea>
    <div class="row" style="margin-top:8px"><label style="display:flex;gap:6px;align-items:center"><span>Consumido por</span><select id="csvQuem" style="width:auto">${quemOpts('casa')}</select></label><label style="display:flex;gap:6px;align-items:center"><span>Pago por</span><select id="csvPagou" style="width:auto">${quemOpts(S.moradores[0]?.id, false)}</select></label><span class="sp"></span><button class="p" onclick="A.importar()">Importar</button></div>
  </details>
  <div class="card">
    <div class="row mb"><h2 style="margin:0">${nomeMes(m)} · ${tx.length} lançamento(s) · ${R(sum(tx.map(t => t.valor)))}</h2><span class="sp"></span>
      <select style="width:auto" onchange="FILTRO.cat=this.value;render()"><option value="">Todas as categorias</option>${catOpts(FILTRO.cat)}</select>
      <input style="width:160px" placeholder="Buscar…" value="${esc(FILTRO.q)}" onchange="FILTRO.q=this.value;render()">
    </div>
    ${tx.length ? `<div class="tw"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Consumo</th><th class="n">Valor</th><th></th></tr>
    ${tx.map(t => `<tr><td>${dataBR(t.data).slice(0, 5)}</td><td>${esc(t.desc)} ${t.aprovada ? '<span class="tag o">aprovada</span>' : ''}</td>
      <td><select class="s" style="width:auto;padding:3px 6px;font-size:13px" onchange="A.setCat('${t.id}',this.value)">${catOpts(t.cat)}</select></td>
      <td class="muted">${esc(nomeQuem(t.quem))}</td><td class="n">${R(t.valor)}</td>
      <td class="n"><button class="x" title="Editar" onclick="A.editar('${t.id}')">✏️</button><button class="x" title="Excluir" onclick="A.del('${t.id}')">✕</button></td></tr>`).join('')}</table></div>`
    : `<div class="empty">Nenhum lançamento ${FILTRO.cat || FILTRO.q ? 'com esse filtro' : 'neste mês'}.</div>`}
  </div>`;
};

V.alocacao = () => {
  const m = MES, tx = txMes(m), tot = sum(tx.map(t => t.valor));
  const aloc = sum(tx.filter(t => t.cat !== 'outros').map(t => t.valor));
  const {linhas, acertos} = rateio(m);
  const g = grupos(m);
  const fixo = sum(tx.filter(t => cat(t.cat).tipo === 'fixo').map(t => t.valor));
  const casa = sum(tx.filter(t => t.quem === 'casa').map(t => t.valor));
  return head('Alocação & Rateio', 'Quem consome o quê (showback) e quanto cada um deve pagar (chargeback). Gastos da "Casa" são divididos pelo peso de cada morador.', 'Informar') + `
  <div class="grid g4 mb">
    ${kpi('Gasto alocado', P(tot ? aloc/tot*100 : 0), `${R0(tot - aloc)} sem categoria`, tot && aloc/tot < .9 ? 'warn' : 'ok')}
    ${kpi('Compartilhado', R0(casa), P(tot ? casa/tot*100 : 0) + ' do total')}
    ${kpi('Fixo × variável', P(tot ? fixo/tot*100 : 0) + ' fixo', `${R0(fixo)} fixo · ${R0(tot - fixo)} variável`)}
    ${kpi('Essencial × estilo', P(tot ? g.essencial/tot*100 : 0) + ' essencial', `${R0(g.essencial)} · ${R0(g.estilo)}`)}
  </div>
  <div class="card"><h2>Showback por morador</h2>
  <div class="tw"><table><tr><th>Morador</th><th class="n">Peso</th><th class="n">Individual</th><th class="n">Parte da casa</th><th class="n">Consumo total</th><th class="n">Responsável por</th><th class="n">Pagou</th><th class="n">Saldo</th></tr>
  ${linhas.map(l => `<tr><td>${esc(l.nome)} ${l.dep ? '<span class="tag">dependente</span>' : ''}</td><td class="n">${N(membro(l.id).peso, 2)}</td><td class="n">${R(l.ind)}</td><td class="n">${R(l.comp)}</td><td class="n"><b>${R(l.total)}</b></td><td class="n">${R(l.devido)}</td><td class="n">${R(l.pagou)}</td><td class="n ${l.saldo < -0.5 ? 'bad' : l.saldo > 0.5 ? 'ok' : ''}">${l.saldo > 0 ? '+' : ''}${R(l.saldo)}</td></tr>`).join('')}
  </table></div><p class="muted" style="font-size:13px">Pesos ajustáveis em <a href="#config">Casa & Dados</a> (ex.: criança = 0,5; quem ganha mais pode ter peso maior). Moradores sem renda são <b>dependentes</b>: o consumo deles é bancado pelos demais, na proporção dos pesos.</p></div>
  <div class="card"><h2>Chargeback — acerto do mês</h2>
  ${acertos.length ? acertos.map(a => `<div class="alert i"><span>💸</span><div class="t"><b>${esc(a.de)}</b> transfere <b>${R(a.v)}</b> para <b>${esc(a.para)}</b></div></div>`).join('') : '<div class="empty">Contas equilibradas — ninguém deve nada a ninguém neste mês.</div>'}</div>
  <div class="card"><h2>Por categoria</h2>${hbars(Object.entries(porCat(m)).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({l:`${cat(k).icone} ${esc(cat(k).nome)}`, v, t:`${R(v)} · ${P(v/tot*100)}`})))||'<div class="empty">Sem dados.</div>'}</div>`;
};

V.relatorios = () => {
  const m = MES, ult = meses(m, 12), vals = ult.map(totalMes), pc = porCat(m), tot = totalMes(m);
  const top = txMes(m).sort((a, b) => b.valor - a.valor).slice(0, 10);
  const cats = Object.entries(pc).sort((a, b) => b[1] - a[1]);
  const com = vals.filter(Boolean);
  const media = com.length ? sum(com)/com.length : 0;
  const trend = meses(m, 6);
  const topCats = cats.slice(0, 6).map(c => c[0]);
  return head('Relatórios & Análises', 'Visibilidade: tendência, composição e maiores gastos.', 'Informar') + `
  <div class="grid g4 mb">
    ${kpi('Total do mês', R0(tot))}
    ${kpi('Média 12 meses', R0(media), `${com.length} mês(es) com dados`)}
    ${kpi('Maior mês', R0(Math.max(0, ...vals)), vals.some(Boolean) ? nomeMes(ult[vals.indexOf(Math.max(...vals))]) : '')}
    ${kpi('Gasto por dia', R(tot / (m === HOJE_YM ? hoje.getDate() : diasNoMes(m))), 'média diária do mês')}
  </div>
  <div class="card"><div class="row"><h2 style="margin:0">Tendência de 12 meses</h2><span class="sp"></span><button class="s" onclick="A.csvMes()">⬇ Exportar CSV do mês</button></div>${barChart(ult.map(x => nomeMes(x, true)), vals, {label:'Gastos dos últimos 12 meses'})}</div>
  <div class="card"><h2>Categorias principais — últimos 6 meses</h2><div class="tw"><table><tr><th>Categoria</th>${trend.map(x => `<th class="n">${nomeMes(x, true)}</th>`).join('')}<th class="n">Var.</th></tr>
  ${topCats.map(k => { const vs = trend.map(x => porCat(x)[k] || 0); const a = vs[vs.length-2], b = vs[vs.length-1]; return `<tr><td>${cat(k).icone} ${esc(cat(k).nome)}</td>${vs.map(v => `<td class="n">${v ? R0(v) : '—'}</td>`).join('')}<td class="n ${b > a ? 'bad' : 'ok'}">${a ? (b >= a ? '+' : '') + P((b/a - 1)*100) : '—'}</td></tr>`; }).join('')}
  </table></div></div>
  <div class="grid g2">
    <div class="card"><h2>Composição de ${nomeMes(m, true)}</h2>${cats.length ? hbars(cats.map(([k, v]) => ({l:`${cat(k).icone} ${esc(cat(k).nome)}`, v, t:P(v/tot*100)}))) : '<div class="empty">Sem dados.</div>'}</div>
    <div class="card"><h2>10 maiores gastos</h2>${top.length ? `<table>${top.map(t => `<tr><td>${esc(t.desc)}<div class="muted" style="font-size:12px">${dataBR(t.data)} · ${cat(t.cat).icone} ${esc(cat(t.cat).nome)}</div></td><td class="n">${R(t.valor)}</td></tr>`).join('')}</table>` : '<div class="empty">Sem dados.</div>'}</div>
  </div>`;
};

V.anomalias = () => {
  const an = anomalias(MES);
  return head('Gestão de anomalias', `Gastos fora do padrão em ${nomeMes(MES)}: categorias acima da média dos 3 meses anteriores (limite +${S.regras.anomaliaPct}%), valores 3× acima do usual e cobranças duplicadas.`, 'Informar') + `
  <div class="card">${an.length ? an.map(a => `<div class="alert ${a.sev}"><span>${a.sev === 'b' ? '🔴' : a.sev === 'w' ? '🟠' : '🔵'}</span><div class="t"><b>${esc(a.tipo)}</b><br>${esc(a.txt)}</div>${a.tx ? `<button class="s" onclick="A.editar('${a.tx}')">Ver</button>` : ''}</div>`).join('') : '<div class="empty">✅ Nenhuma anomalia encontrada neste mês.</div>'}</div>
  <div class="card"><h2>Como agir em uma anomalia</h2><ol class="muted" style="margin:0;padding-left:20px">
    <li><b>Confirme</b>: o gasto é real? Duplicado? Cobrança indevida? Conteste com o banco/fornecedor.</li>
    <li><b>Explique</b>: foi pontual (presente, conserto) ou mudança de padrão (tarifa subiu, novo hábito)?</li>
    <li><b>Ajuste</b>: atualize o orçamento ou crie uma recomendação/política para evitar repetição.</li></ol>
  <p class="muted" style="font-size:13px">A sensibilidade é ajustável em <a href="#governanca">Políticas</a>.</p></div>`;
};

V.unitarios = () => {
  const m = MES, tot = totalMes(m), pc = porCat(m), np = pessoas(), area = S.casa.area || 0, rd = renda();
  const dias = m === HOJE_YM ? hoje.getDate() : diasNoMes(m);
  const cs = t => S.consumos.find(c => c.mes === m && c.tipo === t);
  const en = cs('energia'), ag = cs('agua'), gs = cs('gas');
  const moradia = (pc.moradia || 0) + (pc.energia || 0) + (pc.agua || 0) + (pc.gas || 0) + (pc.internet || 0) + (pc.manutencao || 0);
  const ref = meses(addM(m, -1), 3).filter(x => txMes(x).length);
  const totAnt = ref.length ? sum(ref.map(totalMes))/ref.length : 0;
  return head('Economia unitária', 'Métricas por unidade: tiram o "tamanho" da conta e mostram eficiência — como custo por usuário em uma empresa.', 'Informar') + `
  <div class="grid g3 mb">
    ${kpi('Custo por morador', R(tot/np), `${np} morador(es) · média anterior ${R(totAnt/np)}`)}
    ${kpi('Custo por dia', R(tot/dias), `${dias} dia(s) considerados`)}
    ${kpi('Custo da moradia por m²', area ? R(moradia/area) : '—', area ? `${area} m² · moradia+contas+manutenção` : '<a href="#config">informar área</a>')}
    ${kpi('Energia: R$ por kWh', en && en.qtd ? R(en.custo/en.qtd) : '—', en ? `${N(en.qtd, 0)} kWh · ${N(en.qtd/np, 0)} kWh/pessoa` : '<a href="#consumo">registrar leitura</a>')}
    ${kpi('Água: R$ por m³', ag && ag.qtd ? R(ag.custo/ag.qtd) : '—', ag ? `${N(ag.qtd)} m³ · ${N(ag.qtd*1000/np/diasNoMes(m), 0)} litros/pessoa/dia` : '<a href="#consumo">registrar leitura</a>')}
    ${kpi('Gás: R$ por unidade', gs && gs.qtd ? R(gs.custo/gs.qtd) : '—', gs ? `${N(gs.qtd)} m³/kg` : '<a href="#consumo">registrar leitura</a>')}
    ${kpi('% da renda comprometida', rd ? P(tot/rd*100) : '—', rd ? `renda ${R0(rd)}` : '<a href="#config">informar renda</a>', rd && tot/rd > 0.8 ? 'bad' : '')}
    ${kpi('Mercado por pessoa', R((pc.mercado || 0)/np), 'alimentação em casa')}
    ${kpi('Custo de mobilidade por pessoa', R((pc.transporte || 0)/np), 'transporte')}
  </div>
  <div class="card"><h2>Por que isso importa?</h2><p class="muted" style="margin:0">Se a conta total subiu mas o custo por morador caiu (alguém chegou), a casa ficou <b>mais eficiente</b>. Se o R$/kWh subiu, o problema é <b>tarifa</b> (vá em Tarifas); se os kWh por pessoa subiram, o problema é <b>uso</b> (vá em Consumo). Separar tarifa de uso é o coração do FinOps.</p></div>`;
};

V.orcamento = () => {
  const m = MES, pc = porCat(m), pv = previsao(m), hist = mediaCat(m, 3);
  const linhas = S.categorias.filter(c => S.orcamentos[c.id] || pc[c.id] || pv.det[c.id] || hist[c.id]);
  const to = sum(Object.values(S.orcamentos)), tr = sum(Object.values(pc));
  const prox = [1, 2, 3].map(k => addM(m, k));
  return head('Orçamento & Previsão', 'Budgeting e forecasting: quanto planejamos, quanto já gastamos e como o mês deve fechar.', 'Otimizar') + `
  <div class="grid g4 mb">
    ${kpi('Orçamento do mês', R0(to))}
    ${kpi('Realizado', R0(tr), to ? P(tr/to*100) + ' do orçamento' : '')}
    ${kpi('Previsão de fechamento', R0(pv.total), to ? (pv.total > to ? `estoura em ${R0(pv.total - to)}` : `sobra ${R0(to - pv.total)}`) : '', to && pv.total > to ? 'bad' : 'ok')}
    ${kpi('Precisão da previsão', m < HOJE_YM ? '—' : '±' + P(m === HOJE_YM ? 100 * (1 - hoje.getDate()/diasNoMes(m)) * 0.3 : 30), 'incerteza estimada')}
  </div>
  <div class="card"><div class="row mb"><h2 style="margin:0">Por categoria</h2><span class="sp"></span><button class="s" onclick="A.sugerirOrc()">Sugerir pela média de 3 meses</button></div>
  <div class="tw"><table><tr><th>Categoria</th><th class="n" style="width:130px">Orçamento</th><th class="n">Real</th><th class="n">Previsão</th><th style="min-width:110px">Uso</th></tr>
  ${linhas.map(c => { const o = S.orcamentos[c.id] || 0, r = pc[c.id] || 0, p = pv.det[c.id] || 0; return `<tr><td>${c.icone} ${esc(c.nome)}<div class="muted" style="font-size:12px">${c.tipo} · média ${R0(hist[c.id] || 0)}</div></td>
    <td class="n"><input inputmode="decimal" style="width:110px;text-align:right" value="${o ? N(o, 2) : ''}" placeholder="—" onchange="A.setOrc('${c.id}',this.value)"></td>
    <td class="n">${R(r)}</td><td class="n ${o && p > o ? 'bad' : ''}">${R(p)}</td><td>${o ? pbar(r, o) + `<span class="muted" style="font-size:12px">${P(r/o*100)}</span>` : '<span class="muted" style="font-size:12px">sem orçamento</span>'}</td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">Lance gastos para ver as categorias.</td></tr>'}
  </table></div>
  <details style="margin-top:10px"><summary>+ Orçar outra categoria</summary><div class="row" style="margin-top:8px"><select id="oc_cat" style="width:auto">${catOpts()}</select><input id="oc_val" inputmode="decimal" placeholder="R$" style="width:120px"><button onclick="A.setOrc(val('oc_cat'),val('oc_val'))">Salvar</button></div></details></div>
  <div class="card"><h2>Previsão dos próximos 3 meses</h2>
  ${barChart([nomeMes(m, true), ...prox.map(x => nomeMes(x, true))], [pv.total, ...prox.map(x => previsao(x).total)], {line:[to, to, to, to], label:'Previsão'})}
  <p class="muted" style="font-size:13px;margin:6px 0 0">Baseada na média dos últimos 3 meses + gastos planejados (<a href="#planejamento">Planejamento</a>). Linha tracejada = orçamento atual.</p></div>`;
};

V.planejamento = () => {
  const m = MES;
  return head('Planejamento & Estimativa', 'Antes de assumir um novo gasto recorrente ou uma compra grande, estime o impacto (é o "onboarding" de uma nova carga de trabalho).', 'Otimizar') + `
  <div class="card"><h2>🧩 Onboarding de novo gasto recorrente</h2>
  <p class="muted" style="font-size:13.5px">Ex.: escola nova, plano de saúde, financiamento. Entra automaticamente na previsão a partir do mês de início.</p>
  <div class="form"><label style="grid-column:span 2">Nome<input id="pl_nome" placeholder="ex.: Curso de inglês"></label><label>Valor mensal<input id="pl_val" inputmode="decimal"></label><label>Categoria<select id="pl_cat">${catOpts('educacao')}</select></label><label>Início<input type="month" id="pl_ini" value="${addM(m, 1)}"></label><label>Fim (opcional)<input type="month" id="pl_fim"></label><button class="p" onclick="A.addPlan()">Planejar</button></div>
  ${S.planejados.length ? `<div class="tw" style="margin-top:12px"><table><tr><th>Gasto</th><th>Categoria</th><th>Período</th><th class="n">Mensal</th><th class="n">Anual</th><th></th></tr>${S.planejados.map(p => `<tr><td>${esc(p.nome)}</td><td>${cat(p.cat).icone} ${esc(cat(p.cat).nome)}</td><td>${nomeMes(p.inicio, true)}/${p.inicio.slice(2, 4)} → ${p.fim ? nomeMes(p.fim, true) + '/' + p.fim.slice(2, 4) : 'sem fim'}</td><td class="n">${R(p.valor)}</td><td class="n">${R(p.valor*12)}</td><td class="n"><button class="x" onclick="A.delItem('planejados','${p.id}')">✕</button></td></tr>`).join('')}</table></div>` : ''}
  </div>
  <div class="card"><h2>🧮 Simulador: à vista × parcelado</h2>
  <div class="form"><label>Preço (R$)<input id="sv_p" inputmode="decimal" value="3000" oninput="A.simular()"></label><label>Desconto à vista (%)<input id="sv_d" inputmode="decimal" value="10" oninput="A.simular()"></label><label>Nº de parcelas<input id="sv_n" inputmode="numeric" value="10" oninput="A.simular()"></label><label>Juros ao mês (%)<input id="sv_j" inputmode="decimal" value="0" oninput="A.simular()"></label><label>Rendimento da reserva (% a.m.)<input id="sv_r" inputmode="decimal" value="0,9" oninput="A.simular()"></label></div>
  <div id="simOut" style="margin-top:12px"></div></div>
  <div class="card"><h2>🎯 Quanto preciso guardar?</h2>
  <div class="form"><label>Objetivo (R$)<input id="sg_v" inputmode="decimal" value="10000" oninput="A.simMeta()"></label><label>Prazo (meses)<input id="sg_n" inputmode="numeric" value="12" oninput="A.simMeta()"></label><label>Rendimento (% a.m.)<input id="sg_r" inputmode="decimal" value="0,9" oninput="A.simMeta()"></label></div>
  <div id="metaOut" style="margin-top:12px"></div></div>`;
};

V.tarifas = () => {
  const ctr = S.contratos, eco = sum(ctr.filter(c => c.valorAlt > 0 && c.valorAlt < c.valor).map(c => c.valor - c.valorAlt));
  return head('Otimização de tarifas', 'Pagar menos pelo mesmo serviço: renegociar, trocar de fornecedor e usar compromissos (planos anuais) — como "Reserved Instances" e "Savings Plans" na nuvem.', 'Otimizar') + `
  <div class="grid g3 mb">${kpi('Contratos monitorados', ctr.length)}${kpi('Custo mensal', R0(sum(ctr.map(c => c.valor))))}${kpi('Economia potencial', R0(eco) + '/mês', R0(eco*12) + ' por ano', 'ok')}</div>
  <div class="card"><h2>Contratos & fornecedores</h2>
  <div class="form"><label>Serviço<input id="ct_nome" placeholder="ex.: Internet fibra"></label><label>Fornecedor atual<input id="ct_forn" placeholder="ex.: Operadora A"></label><label>Valor atual (mês)<input id="ct_val" inputmode="decimal"></label><label>Alternativa cotada<input id="ct_alt" placeholder="ex.: Operadora B 500MB"></label><label>Valor alternativa<input id="ct_valt" inputmode="decimal"></label><label>Fim da fidelidade<input type="date" id="ct_venc"></label><button class="p" onclick="A.addContrato()">Adicionar</button></div>
  ${ctr.length ? `<div class="tw" style="margin-top:12px"><table><tr><th>Serviço</th><th>Atual</th><th>Alternativa</th><th class="n">Economia/mês</th><th>Fidelidade</th><th></th></tr>
  ${ctr.map(c => { const e = c.valorAlt > 0 ? c.valor - c.valorAlt : 0; const venc = c.venc && c.venc < HOJE ? '<span class="tag o">livre</span>' : c.venc ? dataBR(c.venc) : '—'; return `<tr><td><b>${esc(c.nome)}</b></td><td>${esc(c.fornecedor)}<div>${R(c.valor)}</div></td><td>${esc(c.alternativa || '—')}<div>${c.valorAlt ? R(c.valorAlt) : '<button class="s" onclick="A.cotar(\'' + c.id + '\')">cotar</button>'}</div></td><td class="n ${e > 0 ? 'ok' : ''}">${e > 0 ? R(e) : '—'}</td><td>${venc}</td><td class="n"><button class="x" onclick="A.cotar('${c.id}')">✏️</button><button class="x" onclick="A.delItem('contratos','${c.id}')">✕</button></td></tr>`; }).join('')}</table></div>` : '<div class="empty">Cadastre internet, celular, seguros, plano de saúde, energia (mercado livre/solar por assinatura), banco…</div>'}
  </div>
  <div class="grid g2">
    <div class="card"><h2>💳 Plano anual × mensal (compromisso)</h2><div class="form"><label>Mensal (R$)<input id="pa_m" inputmode="decimal" value="55,90" oninput="A.simAnual()"></label><label>Anual (R$)<input id="pa_a" inputmode="decimal" value="559" oninput="A.simAnual()"></label><label>Meses que vai usar<input id="pa_u" inputmode="numeric" value="12" oninput="A.simAnual()"></label></div><div id="anualOut" style="margin-top:10px"></div></div>
    <div class="card"><h2>📋 Checklist de tarifas</h2><ul class="muted" style="margin:0;padding-left:18px;font-size:14px">
      <li>Pacote bancário: peça isenção ou migre para conta digital gratuita.</li>
      <li>Cartão: negocie anuidade zero; pague a fatura integral (rotativo é o "on-demand" mais caro que existe).</li>
      <li>Internet/celular: ligue no fim da fidelidade e peça a oferta de retenção.</li>
      <li>Seguros: recote todo ano (auto, residencial, vida).</li>
      <li>Energia: verifique tarifa branca, energia solar por assinatura e bandeira tarifária.</li>
      <li>Compras recorrentes (mercado, farmácia): programas de fidelidade e atacarejo = "desconto por volume".</li></ul></div>
  </div>`;
};

V.consumo = () => {
  const np = pessoas(), m = MES;
  const tipos = ['energia', 'agua', 'gas'];
  const en = S.consumos.filter(c => c.tipo === 'energia');
  const co2 = sum(en.filter(c => c.mes.slice(0, 4) === m.slice(0, 4)).map(c => c.qtd)) * (S.casa.fatorCO2 || 0);
  return head('Consumo & Sustentabilidade', 'Otimização de uso (rightsizing): usar só o necessário. Registre as leituras das contas e compare por pessoa.', 'Otimizar') + `
  <div class="card"><h2>Registrar leitura da conta</h2>
  <div class="form"><label>Mês<input type="month" id="cs_mes" value="${m}"></label><label>Tipo<select id="cs_tipo"><option value="energia">⚡ Energia (kWh)</option><option value="agua">💧 Água (m³)</option><option value="gas">🔥 Gás (m³ ou kg)</option></select></label><label>Quantidade<input id="cs_qtd" inputmode="decimal"></label><label>Valor da conta (R$)<input id="cs_custo" inputmode="decimal"></label><button class="p" onclick="A.addConsumo()">Salvar</button></div></div>
  <div class="grid g3 mb">${tipos.map(t => { const ref = consumoRef(t), regs = S.consumos.filter(c => c.tipo === t).sort((a, b) => a.mes.localeCompare(b.mes)), u = regs[regs.length - 1], pp = u ? u.qtd/np : 0, ant = regs[regs.length - 2];
    return `<div class="card kpi"><div class="l">${ref.ic} ${ref.nome}</div><div class="v ${pp > ref.ref*1.2 ? 'warn' : pp ? 'ok' : ''}">${u ? N(pp) + ' ' + ref.un : '—'}<small style="font-size:12px"> /pessoa</small></div><div class="d">${u ? `${nomeMes(u.mes, true)}: ${N(u.qtd)} ${ref.un} · ${R(u.custo)}${ant ? ` · ${u.qtd >= ant.qtd ? '▲' : '▼'} ${P(Math.abs(u.qtd/ant.qtd - 1)*100)}` : ''}` : 'sem leitura'}<br>referência ~${ref.ref} ${ref.un}/pessoa/mês</div></div>`; }).join('')}</div>
  ${S.consumos.length ? `<div class="card"><h2>Histórico</h2><div class="tw"><table><tr><th>Mês</th><th>Tipo</th><th class="n">Quantidade</th><th class="n">Por pessoa</th><th class="n">Valor</th><th class="n">R$/unidade</th><th></th></tr>
  ${[...S.consumos].sort((a, b) => b.mes.localeCompare(a.mes) || a.tipo.localeCompare(b.tipo)).slice(0, 36).map(c => { const r = consumoRef(c.tipo); return `<tr><td>${nomeMes(c.mes, true)}/${c.mes.slice(2, 4)}</td><td>${r.ic} ${r.nome}</td><td class="n">${N(c.qtd)} ${r.un}</td><td class="n">${N(c.qtd/np)}</td><td class="n">${R(c.custo)}</td><td class="n">${c.qtd ? R(c.custo/c.qtd) : '—'}</td><td class="n"><button class="x" onclick="A.delItem('consumos','${c.id}')">✕</button></td></tr>`; }).join('')}</table></div></div>` : ''}
  <div class="grid g2">
    <div class="card"><h2>🏗️ Payback de melhorias (arquitetura)</h2><p class="muted" style="font-size:13.5px;margin-top:0">Troca de lâmpadas por LED, geladeira eficiente, aquecedor solar, arejadores de torneira…</p>
      <div class="form"><label>Investimento (R$)<input id="pb_inv" inputmode="decimal" value="1200" oninput="A.payback()"></label><label>Economia mensal (R$)<input id="pb_eco" inputmode="decimal" value="60" oninput="A.payback()"></label><label>Vida útil (anos)<input id="pb_vida" inputmode="numeric" value="8" oninput="A.payback()"></label></div><div id="pbOut" style="margin-top:10px"></div></div>
    <div class="card"><h2>🌱 Sustentabilidade</h2><div class="kpi"><div class="l">Pegada de CO₂ da energia em ${m.slice(0, 4)}</div><div class="v">${N(co2, 0)} kg CO₂</div><div class="d">fator ${N(S.casa.fatorCO2, 3)} kg/kWh (ajustável em <a href="#config">Casa & Dados</a>) · equivale a ~${N(co2/7, 0)} árvores/ano</div></div>
      <h2 style="margin-top:14px">Dicas de uso</h2><ul class="muted" style="margin:0;padding-left:18px;font-size:14px"><li>Chuveiro elétrico é o maior vilão: banhos de 5 min e posição "verão".</li><li>Desligue aparelhos em stand-by (o "recurso ocioso" da casa).</li><li>Ar-condicionado em 23–24 °C com portas fechadas.</li><li>Máquina de lavar sempre cheia; geladeira longe do fogão e do sol.</li><li>Vazamentos: feche tudo e veja se o hidrômetro gira.</li></ul></div>
  </div>`;
};

V.assinaturas = () => {
  const a = S.assinaturas, tot = sum(a.map(mensalAss));
  const ocioso = sum(a.filter(x => x.uso === 'nenhum' || x.uso === 'baixo').map(mensalAss));
  const usoTag = {alto:'o', medio:'i', baixo:'w', nenhum:'b'};
  return head('Licenças & SaaS', 'Inventário de assinaturas: quanto custam, quem usa e o que está ocioso (desperdício).', 'Otimizar') + `
  <div class="grid g4 mb">${kpi('Assinaturas', a.length)}${kpi('Custo mensal', R0(tot), R0(tot*12) + ' por ano')}${kpi('Ocioso (baixo/nenhum uso)', R0(ocioso), tot ? P(ocioso/tot*100) + ' do total' : '', ocioso ? 'warn' : 'ok')}${kpi('Taxa de utilização', tot ? P((tot - ocioso)/tot*100) : '—', 'custo com uso médio/alto')}</div>
  <div class="card"><h2>Adicionar assinatura</h2><div class="form"><label>Nome<input id="as_nome" placeholder="ex.: Netflix"></label><label>Valor (R$)<input id="as_val" inputmode="decimal"></label><label>Cobrança<select id="as_ciclo"><option value="mensal">Mensal</option><option value="anual">Anual</option></select></label><label>Uso (30 dias)<select id="as_uso"><option value="alto">Alto</option><option value="medio">Médio</option><option value="baixo">Baixo</option><option value="nenhum">Nenhum</option></select></label><label>Dono<select id="as_dono">${quemOpts('casa')}</select></label><label>Renovação<input type="date" id="as_ren"></label><button class="p" onclick="A.addAss()">Adicionar</button></div>
  <p class="muted" style="font-size:13px;margin-bottom:0">Dica: procure no extrato por cobranças recorrentes da categoria 📺 — este mês somam ${R(porCat(MES).assinaturas || 0)}.</p></div>
  <div class="card">${a.length ? `<div class="tw"><table><tr><th>Assinatura</th><th>Dono</th><th>Uso</th><th class="n">Valor</th><th class="n">Mensal eq.</th><th class="n">Anual</th><th>Renova</th><th></th></tr>
  ${[...a].sort((x, y) => mensalAss(y) - mensalAss(x)).map(x => `<tr><td><b>${esc(x.nome)}</b></td><td class="muted">${esc(nomeQuem(x.dono))}</td><td><select style="width:auto;padding:3px 6px;font-size:13px" onchange="A.setUso('${x.id}',this.value)">${['alto','medio','baixo','nenhum'].map(u => `<option ${u === x.uso ? 'selected' : ''} value="${u}">${u === 'medio' ? 'médio' : u}</option>`).join('')}</select> <span class="tag ${usoTag[x.uso]}">●</span></td><td class="n">${R(x.valor)}<div class="muted" style="font-size:12px">${x.ciclo}</div></td><td class="n">${R(mensalAss(x))}</td><td class="n">${R(mensalAss(x)*12)}</td><td>${x.renov ? dataBR(x.renov) : '—'}</td><td class="n"><button class="x" title="Cancelei" onclick="A.cancelarAss('${x.id}')">🚫</button><button class="x" onclick="A.delItem('assinaturas','${x.id}')">✕</button></td></tr>`).join('')}</table></div><p class="muted" style="font-size:13px">🚫 = "cancelei": remove do inventário e registra a economia em Valor & Metas.</p>` : '<div class="empty">Liste streaming, música, nuvem, academia, apps, clubes de assinatura…</div>'}</div>`;
};

V.recomendacoes = () => {
  const rc = recomendacoes(MES), pend = rc.filter(r => !r.status);
  const areaTag = {'Licenças & SaaS':'i', 'Otimização de tarifas':'o', 'Otimização de uso':'w', 'Eliminar desperdício':'b', 'Orçamento':''};
  return head('Recomendações', 'Oportunidades de economia geradas automaticamente a partir de assinaturas, contratos, consumo, tarifas e orçamento.', 'Otimizar') + `
  <div class="grid g3 mb">${kpi('Pendentes', pend.length)}${kpi('Economia potencial', R0(sum(pend.map(r => r.eco))) + '/mês', R0(sum(pend.map(r => r.eco))*12) + ' por ano', 'ok')}${kpi('Economia já realizada', R0(sum(S.economias.map(e => e.valor))) + '/mês', '<a href="#valor">ver histórico</a>')}</div>
  <div class="card">${rc.length ? rc.map(r => `<div class="alert ${r.status ? '' : 'i'}" style="${r.status ? 'opacity:.55;background:var(--panel2)' : ''}"><span>✨</span><div class="t"><b>${esc(r.titulo)}</b> <span class="tag ${areaTag[r.area] ?? ''}">${r.area}</span> <span class="tag">esforço ${r.esf}</span><br><span class="muted">${r.det}</span><br><b class="ok">≈ ${R(r.eco)}/mês</b></div>
    ${r.status ? `<span class="tag">${r.status === 'feito' ? 'aplicada ✓' : 'ignorada'}</span>` : `<div class="row" style="flex-direction:column;align-items:stretch"><button class="s p" onclick="A.recFeita('${r.k}')">Apliquei</button><button class="s" onclick="A.recIgnorar('${r.k}')">Ignorar</button></div>`}</div>`).join('') : '<div class="empty">Sem recomendações. Cadastre assinaturas, contratos e leituras de consumo para o motor encontrar economias.</div>'}</div>`;
};

V.governanca = () => {
  const rg = S.regras, vi = violacoes(MES);
  const campo = (k, l, suf) => `<label>${l}<input inputmode="decimal" value="${N(rg[k], 2)}" onchange="A.setRegra('${k}',this.value)"></label>`;
  return head('Políticas & Governança', 'As regras da casa, combinadas por todos, e o que está fora delas neste mês.', 'Operar') + `
  <div class="card"><h2>Situação em ${nomeMes(MES)}</h2>${vi.length ? vi.map(v => `<div class="alert ${v.sev}"><span>${v.sev === 'b' ? '⛔' : '⚠️'}</span><div class="t"><b>${esc(v.pol)}</b><br>${esc(v.txt)}</div>${v.acao || ''}</div>`).join('') : '<div class="alert o"><span>✅</span><div class="t">Todas as políticas estão sendo cumpridas.</div></div>'}</div>
  <div class="card"><h2>Regras da casa</h2><div class="form">
    ${campo('limiteCompra', 'Compra variável acima de (R$) precisa de aprovação')}
    ${campo('alertaOrc', 'Alertar ao atingir (% do orçamento)')}
    ${campo('anomaliaPct', 'Anomalia: categoria acima da média em (%)')}
    ${campo('essencialMax', 'Essenciais: máximo (% da renda)')}
    ${campo('estiloMax', 'Estilo de vida: máximo (% da renda)')}
    ${campo('poupancaMin', 'Poupança: mínimo (% da renda)')}
    ${campo('moradiaMax', 'Moradia: máximo (% da renda)')}
  </div></div>
  <div class="card"><h2>Regras de categorização automática</h2><p class="muted" style="font-size:13.5px;margin-top:0">Se a descrição contém algum dos termos (separados por |), o gasto recebe a categoria. É o "tagging policy" da casa.</p>
  <div class="tw"><table><tr><th>Termos</th><th>Categoria</th><th></th></tr>${S.autoCat.map(([p, c], i) => `<tr><td style="font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-word">${esc(p)}</td><td>${cat(c).icone} ${esc(cat(c).nome)}</td><td class="n"><button class="x" onclick="A.delAuto(${i})">✕</button></td></tr>`).join('')}</table></div>
  <div class="row" style="margin-top:10px"><input id="au_p" placeholder="ex.: academia xyz|pilates" style="flex:2;min-width:160px"><select id="au_c" style="flex:1;min-width:140px">${catOpts()}</select><button onclick="A.addAuto()">Adicionar</button><button class="p" onclick="A.reaplicar()">Recategorizar "sem categoria"</button></div></div>`;
};

V.valor = () => {
  const ec = S.economias, tot = sum(ec.map(e => e.valor));
  const ess = (() => { const ms = meses(addM(HOJE_YM, -1), 3).filter(x => txMes(x).length); if (!ms.length) return 0; return sum(ms.map(x => grupos(x).essencial))/ms.length; })();
  const cob = ess ? S.casa.reserva/ess : 0;
  return head('Valor & Metas', 'Quantificar o valor do FinOps: quanto já economizamos e para onde esse dinheiro está indo.', 'Operar') + `
  <div class="grid g4 mb">${kpi('Economia recorrente', R0(tot) + '/mês', R0(tot*12) + ' por ano', 'ok')}${kpi('Ações aplicadas', ec.length)}${kpi('Reserva de emergência', R0(S.casa.reserva), `<a href="javascript:A.editReserva()">atualizar</a>`)}${kpi('Cobertura da reserva', ess ? N(cob) + ' meses' : '—', 'de gastos essenciais (ideal: 6)', cob >= 6 ? 'ok' : 'warn')}</div>
  <div class="card"><h2>🎯 Metas</h2>
  <div class="form"><label style="grid-column:span 2">Meta<input id="mt_nome" placeholder="ex.: Viagem de férias"></label><label>Valor alvo<input id="mt_alvo" inputmode="decimal"></label><label>Já tenho<input id="mt_atual" inputmode="decimal" value="0"></label><label>Prazo<input type="month" id="mt_prazo" value="${addM(HOJE_YM, 12)}"></label><button class="p" onclick="A.addMeta()">Criar</button></div>
  ${S.metas.map(x => { const f = Math.max(0, x.alvo - x.atual), mr = Math.max(1, (() => { const [a, b] = x.prazo.split('-').map(Number), [c, d] = HOJE_YM.split('-').map(Number); return (a - c)*12 + b - d; })()); return `<div style="margin-top:14px"><div class="row"><b>${esc(x.nome)}</b><span class="muted">${R0(x.atual)} de ${R0(x.alvo)} · até ${nomeMes(x.prazo)}</span><span class="sp"></span><button class="s" onclick="A.aportar('${x.id}')">+ Aporte</button><button class="x" onclick="A.delItem('metas','${x.id}')">✕</button></div><div class="bar" style="height:12px;margin:6px 0"><i class="o" style="width:${Math.min(100, x.atual/x.alvo*100)}%"></i></div><div class="muted" style="font-size:13px">${f > 0 ? `Faltam ${R(f)} → guardar ${R(f/mr)}/mês por ${mr} mês(es)` : '🎉 Meta atingida!'}</div></div>`; }).join('') || '<div class="empty">Crie metas para dar destino às economias.</div>'}</div>
  <div class="card"><div class="row mb"><h2 style="margin:0">💰 Economias realizadas</h2><span class="sp"></span><button class="s" onclick="A.addEconomia()">+ Registrar economia</button></div>
  ${ec.length ? `<div class="tw"><table><tr><th>Data</th><th>Ação</th><th class="n">Por mês</th><th class="n">Por ano</th><th></th></tr>${[...ec].reverse().map(e => `<tr><td>${dataBR(e.data)}</td><td>${esc(e.desc)}</td><td class="n ok">${R(e.valor)}</td><td class="n">${R(e.valor*12)}</td><td class="n"><button class="x" onclick="A.delItem('economias','${e.id}')">✕</button></td></tr>`).join('')}</table></div>` : '<div class="empty">Marque recomendações como "Apliquei" ou registre economias manualmente.</div>'}</div>`;
};

V.benchmark = () => {
  const m = MES, rd = renda(), g = grupos(m, true), pv = previsao(m), poup = rd - pv.total;
  const pc = porCat(m), hist = mediaCat(m, 6);
  const bm = [
    ['Essenciais', rd ? g.essencial/rd*100 : 0, S.regras.essencialMax, true],
    ['Estilo de vida', rd ? g.estilo/rd*100 : 0, S.regras.estiloMax, true],
    ['Poupança/investimento', rd ? poup/rd*100 : 0, S.regras.poupancaMin, false],
    ['Moradia', rd ? (pv.det.moradia || 0)/rd*100 : 0, S.regras.moradiaMax, true],
  ];
  const cats = S.categorias.filter(c => pc[c.id] || hist[c.id]);
  return head('Benchmarking', 'Comparação com referências de mercado (regra 50/30/20) e com o próprio histórico da casa.', 'Operar') + `
