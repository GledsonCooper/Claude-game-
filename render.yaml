# Deploy em 1 clique no Render.com: New > Blueprint > selecione este repositório.
services:
  - type: web
    name: pulim
    runtime: node
    plan: starter          # plano pago (US$ 7/mês) mantém o servidor sempre ligado e o disco de vendas
    buildCommand: echo "sem build"
    startCommand: node server.js
    healthCheckPath: /api/config
    disk:
      name: dados
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_PLAY_PACKAGE
        value: br.com.coopercloud.pulim
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TWA_SHA256_FINGERPRINTS
        sync: false
      - key: COMPANY_CNPJ
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: DEMO_PURCHASES
        value: "false"
